[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
vertical-agent-harness = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["packages/agent-harness/src", "tests"]
extend-exclude = ["desktop/resources"]


[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
files = [
  "packages/agent-harness/src/vertical_plugins/common",
  "packages/agent-harness/src/vertical_harness/engine/plugin_loader.py",
  "packages/agent-harness/src/vertical_harness/config",
  "packages/agent-harness/src/vertical_harness/storage/namespace.py",
]
follow_imports = "silent"
ignore_missing_imports = true
check_untyped_defs = true

