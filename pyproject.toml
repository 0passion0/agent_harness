[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
vertical-agent-harness = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["packages/agent-harness/src", "packages/research-citation/src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

