[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "vertical-plugin-data-analysis"
version = "0.1.0"
description = "Scientific tabular data analysis, profiling, execution evidence, and reporting plugin"
requires-python = ">=3.11"
dependencies = [
  "vertical-agent-harness>=0.1,<0.2",
  "duckdb>=1.0.0",
  "openpyxl>=3.1.0",
]

[project.entry-points."vertical_agent.plugins"]
"data_analysis" = "data_analysis.plugin:DataAnalysisPlugin"

[tool.hatch.build.targets.wheel]
packages = ["src/data_analysis"]

[tool.hatch.build]
include = [
  "src/data_analysis/**/*.py",
  "src/data_analysis/**/*.md",
  "src/data_analysis/py.typed",
]
