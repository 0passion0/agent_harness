[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "vertical-agent-harness"
version = "0.1.0"
description = "Composable Deep Agents harness with Python distribution plugins"
requires-python = ">=3.11"
dependencies = [
  "deepagents>=0.7.28,<0.8",
  "langchain[mcp]>=1.4.6,<2",
  "langchain-deepseek>=1.1.1,<2",
  "langchain-exa>=1.1,<2",
  "langgraph>=1.2.16,<2",
  "langgraph-checkpoint-sqlite>=3,<4",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.6,<3",
  "langmem>=0.0.30,<0.1",
  "langsmith>=0.14.11,<0.15",
  "openevals>=0.1,<0.2",
]

[project.optional-dependencies]
postgres = ["langgraph-checkpoint-postgres>=2,<4"]
analysis = ["duckdb>=1.0.0", "openpyxl>=3.1.0"]
dev = ["pytest>=8", "ruff>=0.9", "mypy>=1.15,<2"]

[project.scripts]
vertical-agent = "vertical_harness.cli:main"
vertical-eval = "vertical_harness.evaluation.cli:main"

[project.entry-points."vertical_agent.plugins"]
"data_analysis" = "vertical_plugins.data_analysis:DataAnalysisPlugin"
"research.citations" = "vertical_plugins.research_citation:ResearchCitationPlugin"

[tool.hatch.build.targets.wheel]
packages = ["src/vertical_harness", "src/vertical_plugins"]
include = [
  "src/vertical_harness/**/*.py",
  "src/vertical_harness/py.typed",
  "src/vertical_plugins/**/*.py",
  "src/vertical_plugins/**/*.md",
  "src/vertical_plugins/py.typed",
]

