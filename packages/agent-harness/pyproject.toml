[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "vertical-agent-harness"
version = "0.1.0"
description = "Search, file and Python agent harness"
requires-python = ">=3.11"
dependencies = [
  "deepagents>=0.7.28,<0.8",
  "langchain>=1.4.6,<2",
  "langchain-deepseek>=1.1.1,<2",
  "langchain-exa>=1.1,<2",
  "langgraph>=1.2.16,<2",
  "langgraph-checkpoint-sqlite>=3,<4",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.6,<3",
  "langsmith>=0.14.11,<0.15",
  "markitdown[docx,pdf,pptx,xlsx]>=0.1.4,<0.2",
  "ripgrep-bin>=15.2,<16",
]

[project.optional-dependencies]
desktop = [
    "duckdb>=1.1,<2",
    "lifelines>=0.30,<0.31",
    "matplotlib>=3.9,<4",
    "openpyxl>=3.1.0",
    "pandas>=2.2,<4",
    "pypdf>=5,<7",
    "python-docx>=1.1,<2",
    "python-pptx>=1,<2",
    "scikit-learn>=1.6,<2",
    "scipy>=1.14,<2",
    "statsmodels>=0.14,<0.15",
]
dev = ["pytest>=8", "ruff>=0.9", "mypy>=1.15,<2"]

[project.scripts]
vertical-agent = "vertical_harness.cli:Cli.main"

[tool.hatch.build.targets.wheel]
packages = ["src/vertical_harness"]
include = [
  "src/vertical_harness/**/*.py",
  "src/vertical_harness/py.typed",
  "src/vertical_harness/THIRD_PARTY_NOTICES.txt",
]
