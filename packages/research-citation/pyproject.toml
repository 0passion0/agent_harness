[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "vertical-plugin-research-citation"
version = "0.1.0"
description = "Independent example research citation plugin"
requires-python = ">=3.11"
dependencies = ["vertical-agent-harness>=0.1,<0.2"]

[project.entry-points."vertical_agent.plugins"]
"research.citations" = "research_citation.plugin:ResearchCitationPlugin"

[tool.hatch.build.targets.wheel]
packages = ["src/research_citation"]

[tool.hatch.build]
include = [
  "src/research_citation/**/*.py",
  "src/research_citation/**/*.md",
  "src/research_citation/py.typed",
]

